<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapas de Malagueño</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#1d232b; --muted:#5d6773; --line:#dde2e8; --panel:rgba(255,255,255,.96);
    --accent:#1a5fb4; --chip:#f2f4f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',system-ui,sans-serif}
  #map{position:absolute;inset:0}
  header{position:absolute;top:12px;left:56px;z-index:1000;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:calc(100% - 72px)}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.1px}
  header p{margin:2px 0 0;font-size:12px;color:var(--muted)}

  /* Panel de capas + leyenda */
  #panel{position:absolute;top:12px;right:12px;z-index:1000;width:310px;max-height:calc(100% - 60px);overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px}
  #panel .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--panel);z-index:1}
  #panel .hd b{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
  #toggle{border:0;background:var(--chip);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer;color:var(--fg)}
  .sec{padding:10px 14px;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:0}
  .maprow{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .maprow input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
  .maprow .t{font-weight:600;font-size:14px;line-height:1.3}
  .maprow .s{color:var(--muted);font-size:12px}
  .legend{margin:8px 0 2px 26px;display:grid;gap:5px}
  .legend.off{opacity:.4}
  .li{display:flex;align-items:center;gap:8px;line-height:1.25}
  .sw{width:22px;height:14px;border:1px solid #232323;flex:none;border-radius:2px}
  .sw.line{height:0;border:0;border-top:3px solid #ff3333;border-radius:0}
  .sw.circ{width:18px;height:18px;border-radius:50%;background:rgba(20,20,20,.72);border:1.5px solid #fff;
    box-shadow:0 0 0 1px #000;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:600}
  .note{color:var(--muted);font-size:11.5px;margin:6px 0 0 26px}
  .bases{display:flex;flex-wrap:wrap;gap:6px}
  .bases label{background:var(--chip);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12px}
  .bases input{display:none}
  .bases input:checked + span{color:var(--accent);font-weight:600}
  #scale{position:absolute;left:12px;bottom:26px;z-index:1000;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:3px 9px;font-size:12px;font-variant-numeric:tabular-nums}
  #loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1100;background:var(--panel);
    padding:10px 16px;border-radius:8px;border:1px solid var(--line);font-size:13px}

  /* Etiquetas */
  .lbl{background:none;border:0}
  .lbl span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:#fff;font-weight:600;
    text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 2px #000;pointer-events:none}
  .lbl.parc span{font-size:11px}
  .lbl.mz span{font-size:11px;min-width:24px;height:24px;padding:0 4px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:rgba(20,20,20,.72);border:1.5px solid #fff;box-shadow:0 0 0 1px #000}

  /* Pop-ups */
  .leaflet-popup-content{margin:10px 12px;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;min-width:220px}
  .pp h3{margin:0 0 6px;font-size:13.5px;font-weight:600}
  .pp table{border-collapse:collapse;width:100%}
  .pp td{padding:3px 0;border-top:1px solid #eef0f3;vertical-align:top}
  .pp td:first-child{color:var(--muted);padding-right:10px;white-space:nowrap}
  .pp .desc{max-width:280px;line-height:1.35}

  @media (max-width:640px){
    header{left:12px;top:auto;bottom:46px;right:auto;max-width:calc(100% - 24px);padding:6px 10px}
    header h1{font-size:14px}
    header p{display:none}
    #panel{left:56px;right:12px;width:auto;max-height:60%}
    #panel.collapsed .body{display:none}
    #scale{bottom:auto;top:12px;left:auto;right:12px;display:none}
  }
  #panel.collapsed .body{display:none}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <h1>Malagueño · Mapas territoriales</h1>
  <p>Parcelas, uso del suelo actual y usos del suelo IPLAM</p>
</header>

<div id="panel">
  <div class="hd"><b>Capas y leyenda</b><button id="toggle" type="button">Ocultar</button></div>
  <div class="body">
    <div class="sec">
      <label class="maprow"><input type="checkbox" data-map="m1" checked>
        <div><div class="t">1 · Parcelas</div><div class="s">Estado de edificación (catastro)</div></div></label>
      <div class="legend" id="lg-m1"></div>
      <div class="note">Número de parcela desde escala 1:2.500; más alejado, sólo el número de manzana.</div>
    </div>
    <div class="sec">
      <label class="maprow"><input type="checkbox" data-map="m2">
        <div><div class="t">2 · Uso del suelo actual</div><div class="s">Canteras, ANP, industria y urbanizado</div></div></label>
      <div class="legend off" id="lg-m2"></div>
    </div>
    <div class="sec">
      <label class="maprow"><input type="checkbox" data-map="m3">
        <div><div class="t">3 · Usos del suelo IPLAM</div><div class="s">Plan Metropolitano de Córdoba</div></div></label>
      <div class="legend off" id="lg-m3"></div>
    </div>
    <div class="sec">
      <div class="legend" style="margin-left:0">
        <div class="li"><span class="sw line"></span>Radio urbano de Malagueño (en todos los mapas)</div>
      </div>
    </div>
    <div class="sec">
      <div class="s" style="color:var(--muted);font-size:12px;margin-bottom:6px">Mapa base</div>
      <div class="bases" id="bases"></div>
    </div>
  </div>
</div>
<div id="scale">Escala 1:—</div>
<div id="loading">Cargando capas…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ------------------------------------------------------------------ Configuración
const ESCALA_PARCELAS = 2500;   // número de parcela visible a 1:2500 o más cerca
const DPI = 96;                 // misma referencia que la pantalla de QGIS

const C = {
  // Colores tomados del proyecto QGIS (gral_malagueño.qgz)
  estado: {
    'BALDIO':         ['#e4771c','Baldío'],
    'EDIFICADO NoPH': ['#1a7ae8','Edificado'],
    'EDIFICADO PH':   ['#782173','Edificado PH'],
    'ANP':            ['#3e7821','Área natural protegida']
  },
  actual: {
    cantera:   ['#a6a6a6','Cantera'],
    anp:       ['#5cd65c','Área natural protegida (ANP)'],
    cons:      ['#ff9900','Urbanizado consolidado'],
    nocons:    ['#ffe599','Urbanizado no consolidado'],
    industria: ['#9900ff','Industria']
  },
  iplam: {
    'urbanizacion_consolidada': ['#3bcb88','Urbanización consolidada'],
    'urbanizacion_prioritaria': ['#10dde4','Urbanización prioritaria'],
    'urbanizacion_diferida':    ['#dce622','Urbanización diferida'],
    'mixta_productiva':         ['#35ea3b','Mixta productiva'],
    'valor_estrategico':        ['#d129c9','Valor estratégico'],
    'verde_recreativa':         ['#6f6cd5','Verde recreativa'],
    'colectora':                ['#a465db','Colectora (sistema vial)'],
    'industrial_incompatible':  ['#81c942','Industrial incompatible'],
    'agropecuaria_cat_1':       ['#5f9add','Agropecuaria categoría 1'],
    'agropecuaria_cat_2':       ['#e4830d','Agropecuaria categoría 2'],
    'natural_protegida':        ['#e02a21','Natural protegida']
  }
};

// ------------------------------------------------------------------ Mapa y bases
const map = L.map('map', {zoomSnap: 0.25, zoomDelta: 0.5, preferCanvas: true, maxZoom: 21})
  .setView([-31.46, -64.40], 13);
const renderer = L.canvas({padding: 0.3, tolerance: 2});

const bases = {
  'Satélite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxNativeZoom: 19, maxZoom: 21, attribution: 'Imágenes © Esri, Maxar, Earthstar Geographics'}),
  'Calles (OSM)': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxNativeZoom: 19, maxZoom: 21, attribution: '© colaboradores de OpenStreetMap'}),
  'Claro': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {maxNativeZoom: 20, maxZoom: 21, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO'})
};
let baseActual = bases['Satélite'].addTo(map);
const basesDiv = document.getElementById('bases');
Object.keys(bases).forEach((k, i) => {
  const l = document.createElement('label');
  l.innerHTML = `<input type="radio" name="base" ${i === 0 ? 'checked' : ''}><span>${k}</span>`;
  l.querySelector('input').addEventListener('change', () => {
    map.removeLayer(baseActual); baseActual = bases[k].addTo(map); baseActual.bringToBack();
  });
  basesDiv.appendChild(l);
});
L.control.scale({imperial: false, position: 'bottomleft'}).addTo(map);

// Panes para ordenar los mapas (IPLAM abajo, parcelas arriba, radio urbano encima de todo)
[['m3', 410], ['m2', 420], ['m1', 430], ['radio', 450], ['labels', 460]].forEach(([n, z]) => {
  map.createPane(n).style.zIndex = z;
});
map.getPane('labels').style.pointerEvents = 'none';

// ------------------------------------------------------------------ Utilidades
const fmt = (v, dec = 0) => (v === null || v === undefined || v === '') ? '—'
  : (typeof v === 'number' ? v.toLocaleString('es-AR', {maximumFractionDigits: dec}) : String(v));
const money = v => (typeof v === 'number') ? '$ ' + v.toLocaleString('es-AR', {maximumFractionDigits: 0}) : '—';
function popup(title, rows) {
  const tr = rows.filter(r => r[1] !== undefined).map(([k, v, cls]) =>
    `<tr><td>${k}</td><td class="${cls || ''}">${v}</td></tr>`).join('');
  return `<div class="pp"><h3>${title}</h3><table>${tr}</table></div>`;
}
function escala() {
  const c = map.getCenter();
  const mpp = 40075016.686 * Math.cos(c.lat * Math.PI / 180) / (256 * Math.pow(2, map.getZoom()));
  return mpp * DPI / 0.0254;
}
const sw = (color, label) => `<div class="li"><span class="sw" style="background:${color}"></span>${label}</div>`;
const fill = (color, op = 0.8) => ({renderer, color: '#232323', weight: 0.6, fillColor: color, fillOpacity: op});
const getJSON = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); });

// ------------------------------------------------------------------ Leyendas
document.getElementById('lg-m1').innerHTML =
  Object.values(C.estado).map(([c, l]) => sw(c, l)).join('') +
  `<div class="li"><span class="sw circ">12</span>Número de manzana</div>`;
document.getElementById('lg-m2').innerHTML = Object.values(C.actual).map(([c, l]) => sw(c, l)).join('');
document.getElementById('lg-m3').innerHTML = Object.values(C.iplam).map(([c, l]) => sw(c, l)).join('');

// ------------------------------------------------------------------ Capas
const grupos = {m1: L.layerGroup(), m2: L.layerGroup(), m3: L.layerGroup()};
let parcelas = [], manzanas = [];
const etiquetas = L.layerGroup().addTo(map);

Promise.all([
  getJSON('data/radio_urbano.geojson'), getJSON('data/parcelas.geojson'), getJSON('data/manzanas.geojson'),
  getJSON('data/canteras.geojson'), getJSON('data/anp.geojson'), getJSON('data/residencial.geojson'),
  getJSON('data/industria.geojson'), getJSON('data/iplam.geojson')
]).then(([radio, parc, mz, cant, anp, resid, ind, iplam]) => {

  // Radio urbano: siempre visible, en todos los mapas
  const radioLy = L.geoJSON(radio, {pane: 'radio', style: {renderer, color: '#ff3333', weight: 2.5, fill: false},
    interactive: false}).addTo(map);

  // ---- Mapa 1: parcelas
  L.geoJSON(parc, {
    pane: 'm1',
    style: f => fill((C.estado[f.properties.Estado] || ['#ea9152'])[0], 0.72),
    onEachFeature: (f, l) => {
      const p = f.properties;
      l.bindPopup(() => popup('Parcela ' + (p.parcela ?? '') + (p.mz !== undefined ? ' · Manzana ' + p.mz : ''), [
        ['Estado', (C.estado[p.Estado] || [, p.Estado])[1] || '—'],
        ['Nomenclatura', fmt(p.Nomenclatu)],
        ['Designación oficial', fmt(p.desig_ofic)],
        ['Tipo de parcela', fmt(p.Tipo_Parce)],
        ['Superficie', fmt(p.Superficie, 2) + ' m²'],
        ['Valuación', money(p.Valuacion)],
        ['Nº de cuenta', fmt(p.Nro_Cuenta ? String(p.Nro_Cuenta) : '')],
        ['Expediente creación', fmt(p.exp_creaci)],
        ['Fecha creación', fmt(p.Fecha_Crea)],
        ['Pedanía', fmt(p.pedania)],
        ['Localidad', fmt(p.localidad)]
      ]));
    }
  }).addTo(grupos.m1);
  parcelas = parc.features.filter(f => f.properties.parcela !== undefined)
    .map(f => ({ll: L.latLng(f.properties._ly, f.properties._lx), t: f.properties.parcela}));
  manzanas = mz.features.map(f => ({ll: L.latLng(f.properties._ly, f.properties._lx), t: f.properties.mz, n: f.properties.n_parcelas}));

  // ---- Mapa 2: uso del suelo actual
  L.geoJSON(anp, {pane: 'm2', style: fill(C.actual.anp[0], 0.6),
    onEachFeature: (f, l) => { const p = f.properties; l.bindPopup(popup('Área natural protegida', [
      ['Nombre', fmt(p.fna)], ['Categoría', fmt(p.gna)], ['Jurisdicción', fmt(p.caa)],
      ['Administración', fmt(p.sag)], ['Dominio', fmt(p.dominio)], ['Superficie', fmt(p.ara) + ' ha'],
      ['Año de creación', fmt(p.dct ? String(p.dct) : '')]])); }}).addTo(grupos.m2);
  L.geoJSON(resid, {pane: 'm2',
    style: f => fill(f.properties.Densidad === 'Consolidado' ? C.actual.cons[0] : C.actual.nocons[0], 0.75),
    onEachFeature: (f, l) => l.bindPopup(popup('Área urbanizada', [
      ['Uso', 'Residencial'],
      ['Densidad', fmt(f.properties.Densidad)],
      ['Categoría', f.properties.Densidad === 'Consolidado' ? C.actual.cons[1] : C.actual.nocons[1]]]))
  }).addTo(grupos.m2);
  L.geoJSON(ind, {pane: 'm2', style: fill(C.actual.industria[0], 0.75),
    onEachFeature: (f, l) => l.bindPopup(popup('Industria', [['Uso', 'Industrial'], ['ID', fmt(f.properties.fid)]]))
  }).addTo(grupos.m2);
  L.geoJSON(cant, {pane: 'm2', style: fill(C.actual.cantera[0], 0.85),
    onEachFeature: (f, l) => { const p = f.properties; l.bindPopup(popup('Cantera', [
      ['Establecimiento', fmt(p.establecim)], ['Razón social', fmt(p.razon_soci)],
      ['Actividad', fmt(p.actividad)], ['Material', fmt(p.material_s)],
      ['RUAMI', fmt(p.ruami)], ['Expte. impacto ambiental', fmt(p.impacto_am)]])); }}).addTo(grupos.m2);

  // ---- Mapa 3: IPLAM
  L.geoJSON(iplam, {pane: 'm3',
    style: f => fill((C.iplam[f.properties.Categoria] || ['#db166f'])[0], 0.7),
    onEachFeature: (f, l) => { const p = f.properties; l.bindPopup(popup(
      (C.iplam[p.Categoria] || [, p.Categoria])[1], [
      ['Categoría IPLAM', fmt(p.Categoria)],
      ['Superficie', fmt(p.Superficie, 2)],
      ['Descripción', fmt(p.Descripcio), 'desc']])); }}).addTo(grupos.m3);

  // Encuadre inicial al radio urbano
  map.fitBounds(radioLy.getBounds(), {padding: [20, 20]});

  // Controles de visibilidad
  document.querySelectorAll('input[data-map]').forEach(cb => {
    const sync = () => {
      const g = grupos[cb.dataset.map];
      cb.checked ? g.addTo(map) : map.removeLayer(g);
      document.getElementById('lg-' + cb.dataset.map).classList.toggle('off', !cb.checked);
      actualizarEtiquetas();
    };
    cb.addEventListener('change', sync); sync();
  });
  document.getElementById('loading').remove();
}).catch(err => {
  document.getElementById('loading').textContent = 'No se pudieron cargar las capas (' + err.message + ').';
});

// ------------------------------------------------------------------ Etiquetas según escala
function colocar(lista, cls, bounds, ocupados, w, h, max) {
  let n = 0;
  for (const it of lista) {
    if (!bounds.contains(it.ll)) continue;
    const pt = map.latLngToContainerPoint(it.ll);
    const txt = String(it.t), ww = Math.max(w, txt.length * 7 + 8);
    const box = [pt.x - ww / 2, pt.y - h / 2, pt.x + ww / 2, pt.y + h / 2];
    if (ocupados.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
    ocupados.push(box);
    L.marker(it.ll, {pane: 'labels', interactive: false, keyboard: false,
      icon: L.divIcon({className: 'lbl ' + cls, html: `<span>${txt}</span>`, iconSize: [0, 0]})}).addTo(etiquetas);
    if (++n >= max) break;
  }
}
function actualizarEtiquetas() {
  const s = escala();
  document.getElementById('scale').textContent = 'Escala 1:' + Math.round(s).toLocaleString('es-AR');
  etiquetas.clearLayers();
  if (!map.hasLayer(grupos.m1)) return;
  const b = map.getBounds().pad(0.05), ocupados = [];
  // las manzanas tienen prioridad; con escala cercana se suman los números de parcela
  colocar(manzanas, 'mz', b, ocupados, 26, 26, 1500);
  if (s <= ESCALA_PARCELAS + 1) colocar(parcelas, 'parc', b, ocupados, 14, 13, 3000);
}
map.on('moveend zoomend', actualizarEtiquetas);

// Panel plegable
const panel = document.getElementById('panel'), tg = document.getElementById('toggle');
tg.addEventListener('click', () => {
  panel.classList.toggle('collapsed');
  tg.textContent = panel.classList.contains('collapsed') ? 'Mostrar' : 'Ocultar';
});
if (window.innerWidth < 640) { panel.classList.add('collapsed'); tg.textContent = 'Mostrar'; }
</script>
</body>
</html>
